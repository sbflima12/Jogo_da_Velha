<!DOCTYPE html>
<html lang="pt-br"> 

<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jogo da Velha </title>

    <!-- Fontes:-->
     <!-- Mystery Quest, Griffy, Spirax, Almendra Display  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Cherry+Bomb+One&family=Crafty+Girls&family=Griffy&family=Mystery+Quest&family=Playwrite+BR+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rouge+Script&family=Spirax&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/botao.css">

    <script src="js/index.js" defer></script>
    <script src="js/audio.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <h1>Jogo da Velha</h1>
        </div>
        <button class="btpause" id="btAudio"> Áudio </button>
    </header>

    

    <main>
    <div class="titulo">
    <h2> Digite o Nome dos Jogadores </h2>
    </div>

    <div class="caixaJogador"> 
    <div class="jogador jogador1"> 
        <div class= "jogadorAvatar">
            <img src="imagens/Botao.png">
        </div>
        <p class="nomeJogador"> Jogador 1 </p>
        <label> Nome: </label>
        <input type="text" id="nome1" name="nome" required>
    </div>
    
    <div class="jogador jogador2"> 
        <div class= "jogadorAvatar">
            <img src="imagens/Triangulo.png">
        </div>
        <p class="nomeJogador"> Jogador 2 </p>
        <label> Nome: </label>
        <input type="text" id="nome2" name="nome" required>
    </div>
    </div>

    <a href="jogo.html" class="btCorte"> 
        <span class="textoInvisivel"> Começar </span>
        <span class="metade topo"> Começar </span>
        <span class="metade baixo"> Começar </span>
        <span class="linhaCostura"></span>
        <span class="tesoura">✂️</span>
    </a>
    </main>

    <div class="menuPause" id="menuAudio">
        <div class="containerPause">
            <h2> Configurações de Áudio </h2>
            
            <div class="controleVolume">
                <label for="volumeSlider"> Volume da Música </label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
            </div>

            <div class="controleVolume">
                <label for="efeitosSlider"> Efeitos Sonoros </label>
                <input type="range" id="efeitosSlider" min="0" max="1" step="0.01">
            </div>

            <div class="botoesPause">
                <button class="bts" id="btFecharAjus"> Fechar </button>
            </div>
        </div>
    </div>
    <footer>
        <p></p>
    </footer>

</body>
