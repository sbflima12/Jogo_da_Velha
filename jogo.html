<!DOCTYPE html>
<html lang="pt-br"> 

<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jogo da Velha </title>

    <!-- Fontes:-->
     <!-- Mystery Quest, Griffy, Spirax, Almendra Display  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Cherry+Bomb+One&family=Crafty+Girls&family=Griffy&family=Mystery+Quest&family=Playwrite+BR+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rouge+Script&family=Spirax&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="css/jogo.css">
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/botao.css">

    <script src="js/jogo.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <h1>Jogo da Velha</h1>
        </div>
        <button class="btpause" id="btPause"> Pause </button>
    </header>

    <main class="conteudoPrincipal"> 
        <div class="areaDeJogo">
            <div class="jogador jogador1"> 
                <div class= "jogadorAvatar">
                    <img src="imagens/Botao.png">
                </div>
                <p class="nomeJogador"> Jogador 1 </p>
                <p> Pontos: <span id="pontos1"> 0 </span> </p>
            </div>

            <div class="tabuleiro">
                <img src="imagens/Tabuleiro.png" alt="Tabuleiro de jogo da velha" class="imgTabuleiro">
                <div class="grade"> 
                    <div class="celula" data-index="0"> </div>
                    <div class="celula" data-index="1"> </div>
                    <div class="celula" data-index="2"> </div>
                    <div class="celula" data-index="3"> </div>
                    <div class="celula" data-index="4"> </div>
                    <div class="celula" data-index="5"> </div>
                    <div class="celula" data-index="6"> </div>
                    <div class="celula" data-index="7"> </div>
                    <div class="celula" data-index="8"> </div>
                </div>
            </div>

            <div class="jogador jogador2"> 
                <div class= "jogadorAvatar">
                    <img src="imagens/Triangulo.png">
                </div>
                <p class="nomeJogador"> Jogador 2 </p>
                <p> Pontos: <span id="pontos2"> 0 </span> </p>
           </div>
        </div>

    
        <div class="statusJogo"> 
            <div class="container"> 
                <p> Vez de <span id="nomeVez"> Jogador 1 </span> </p> 
            </div>

            <div class="container">
                <p> Empates: <span id="pontosEmpate"> 0 </span></p>
            </div>
        </div>
    </main>

    <footer> 
        <p></p>
    </footer>

    <div class="menuPause" id="menuPause">
        <div class="containerPause"> 
            <h2> Jogo Pausado </h2>
            <div class="botoesPause">
                <button class="bts" id="btReiniciar"> Reiniciar </button>
                <button class="bts" id="btContinuar"> Continuar </button>
                <a href="index.html" class="bts" id="btVoltar"> Voltar </a>
           </div>
        </div> 
    </div>

    <div class="menuPause" id="menuFim"> 
        <div class="containerPause">
            <h2> Fim da rodada </h2>
            <p id="mensagemVencedor"> </p>
            <div class="botoesPause">
                <button class="bts" id="btJoNov"> Próxima Rodada </button>
                <a href="index.html" class="bts"> Sair do Jogo </a>
            </div>
        </div>
    </div>
    
</body>

</html>
